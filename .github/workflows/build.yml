name: Build Windows installer
on:
  push:
    branches: [main]
    # Pushing a tag such as v0.2.1 publishes that release; pushes to main only build.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Read version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content ServerHat.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
      # .NET Framework 4.8 comes with Windows, so this is a small folder, not a self-contained runtime.
      - name: Publish application
        shell: pwsh
        run: |
          dotnet publish ServerHat.csproj -c Release -o publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          Get-ChildItem publish | Format-Table Name, Length
          "Total: {0:N2} MB" -f ((Get-ChildItem publish -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      # Runs the real server manager and API: starts servers through a .cmd shim, stops their
      # whole process tree, and checks the API's answers against the macOS version's bytes.
      - name: Smoke test
        shell: pwsh
        run: |
          $app = Start-Process publish/ServerHat.exe -ArgumentList '--smoke-test' -PassThru -Wait
          Get-Content smoke-test.log
          if ($app.ExitCode -ne 0) { throw "Smoke test failed: $($app.ExitCode)" }
      # The Microsoft Store version. It's uploaded unsigned: the Store signs it when it publishes.
      - name: Build MSIX package
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*" | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          "$sdk\x64" | Out-File $env:GITHUB_PATH -Append
          New-Item -ItemType Directory msix-layout, dist -Force | Out-Null
          Copy-Item publish\* msix-layout -Recurse
          Copy-Item msix\Assets msix-layout -Recurse
          $manifest = [xml](Get-Content msix\AppxManifest.xml)
          $manifest.Package.Identity.Version = "$env:VERSION.0"
          $manifest.Save("$PWD\msix-layout\AppxManifest.xml")
          & "$sdk\x64\makeappx.exe" pack /d msix-layout /p "dist\ServerHat-$env:VERSION-x64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
      # Signs a copy with a throwaway certificate and installs it. Then checks what the Store
      # version must get right: the ServerHat.exe alias answers MCP, and the app writes its
      # API token to the real %APPDATA%, where scripts and agents read it.
      - name: Test-install MSIX package
        shell: pwsh
        run: |
          $msix = (Get-Item dist\*.msix).FullName
          $identity = ([xml](Get-Content msix\AppxManifest.xml)).Package.Identity
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $identity.Publisher -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath test.pfx -Password $password | Out-Null
          Import-PfxCertificate -FilePath test.pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $password | Out-Null
          Copy-Item $msix test.msix
          signtool sign /fd SHA256 /f test.pfx /p test test.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Add-AppxPackage test.msix
          $package = Get-AppxPackage -Name $identity.Name
          if (-not $package) { throw "MSIX did not install" }
          "Installed $($package.PackageFullName)"

          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\ServerHat.exe"
          if (-not (Test-Path $alias)) { throw "The ServerHat.exe app execution alias is missing" }

          $start = New-Object System.Diagnostics.ProcessStartInfo $alias, "--mcp"
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $mcp = [System.Diagnostics.Process]::Start($start)
          $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          $mcp.StandardInput.Flush()
          $read = $mcp.StandardOutput.ReadLineAsync()
          if (-not $read.Wait(20000)) { throw "The alias's MCP server didn't answer initialize" }
          "MCP: $($read.Result)"
          if ($read.Result -notmatch '"serverhat"') { throw "Unexpected MCP answer" }
          $mcp.StandardInput.Close()
          if (-not $mcp.WaitForExit(10000)) { $mcp.Kill() }

          $support = Join-Path $env:APPDATA "ServerHat"
          Get-Process ServerHat -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item $support -Recurse -Force -ErrorAction SilentlyContinue
          Start-Process $alias
          $token = Join-Path $support "api-token"
          for ($i = 0; $i -lt 30 -and -not (Test-Path $token); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $token)) { throw "The packaged app didn't write $token (is file write virtualization still on?)" }
          $auth = @{ Authorization = "Bearer " + (Get-Content $token).Trim() }
          (Invoke-RestMethod http://127.0.0.1:47317/v1/servers -Headers $auth) | ConvertTo-Json -Depth 3
          "The packaged app's API works with the token in the real %APPDATA%"
          Get-Process ServerHat -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-AppxPackage $package.PackageFullName
      - uses: actions/upload-artifact@v4
        with:
          name: ServerHat-Windows-msix
          path: dist/*.msix
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ServerHat-Windows-installer
          path: dist/ServerHat-*-Windows-Setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          if ($env:GITHUB_REF_NAME -ne $tag) { throw "Tag $env:GITHUB_REF_NAME doesn't match ServerHat.csproj; expected $tag" }
          # Fails if the release already exists, so a published installer is never replaced.
          gh release create $tag "dist/ServerHat-$env:VERSION-Windows-Setup.exe" --title "ServerHat for Windows $env:VERSION" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
